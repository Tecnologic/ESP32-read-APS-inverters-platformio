; PlatformIO project file for ESP32-read-APS-inverters
; Board: Wemos/Lolin D1 Mini32 (ESP32-WROOM-32, D1-mini form factor)
;
; ported from https://github.com/patience4711/ESP32-read-APS-inverters
; (Arduino multi-tab sketch -> PlatformIO project, pins centralised in
; include/board_pins_wemos_d1_mini32.h)

[env:wemos_d1_mini32]
platform  = espressif32
board     = wemos_d1_mini32
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; the project uses SPIFFS.h / FS.h to store the inverter/config files
board_build.filesystem  = spiffs
board_build.partitions  = default.csv

build_flags =
    -Wall
    -Wextra

; deep+ so the Library Dependency Finder also picks up headers that are
; only reachable through the many .ino "tabs" (AAA_INCLUDES.h etc.)
lib_ldf_mode = deep+

lib_deps =
    ; ESPAsyncWebServer fork that ships its headers as ESPAsyncWebSrv.h /
    ; AsyncEventSource.h - this is exactly what AAA_INCLUDES.h includes.
    https://github.com/dvarrel/ESPAsyncWebSrv.git
    ; matching AsyncTCP fork required by the above (provides <AsyncTCP.h>)
    https://github.com/dvarrel/AsyncTCP.git
    ; JSON (project uses the ArduinoJson v7 "JsonDocument" API)
    bblanchon/ArduinoJson @ ^7
    ; MQTT client
    knolleary/PubSubClient @ ^2.8
    ; NTP time sync
    arduino-libraries/NTPClient @ ^3.2.1
    ; TimeLib.h
    paulstoffregen/Time @ ^1.6.1
    ; sunrise/sunset calculation (sunMoon.h/.cpp, not on the PIO registry
    ; under a package name -> pulled directly from source)
    https://github.com/sfrwmaker/sunMoon.git

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini (RISC-V, only 13 GPIOs, no Serial2/UART2 - see
; include/board_pins_esp32c3_supermini.h for the pin/UART adaptation).
; Intended for the antenna-mod build (soldered lambda/4 wire, see
; https://peterneufeld.wordpress.com/2025/03/04/esp32-c3-supermini-antenna-modification/)
; - a pure RF hw mod, no code impact.
; ---------------------------------------------------------------------------
[env:esp32-c3-supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1   ; generic C3/4MB devboard definition - matches
                                  ; the SuperMini's chip/flash, only silkscreen differs
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.filesystem      = spiffs
board_build.partitions      = default.csv
; native-USB CDC boards need this so Serial output is available right from
; boot instead of only after the USB stack has enumerated
board_build.usb_cdc_on_boot = yes

build_flags =
    -Wall
    -Wextra
    -DBOARD_ESP32C3_SUPERMINI
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_ldf_mode = deep+
lib_deps = ${env:wemos_d1_mini32.lib_deps}
